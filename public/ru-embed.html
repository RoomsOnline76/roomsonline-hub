<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel Manager</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Set from the ?bg= param so the frame matches the ROL'OS page background. */
        background: var(--rolos-bg, #fff);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #ruApp {
        min-height: 100%;
        background: transparent;
      }

      /*
        Night mode: the embedded channel manager ships a light-only stylesheet, so its
        content is left at its native colours (inverting it made the connector cards
        illegible). Only the surrounding canvas follows the ROL'OS theme via ?bg=.
      */



      /*
        Layout-only centering of the White Label client. RU ships a left-aligned
        fluid layout; inside our fixed-width embed frame that leaves a large gap on
        the right. We centre their page shell and the channel card grids without
        touching any of their colours, sizing or behaviour.
      */
      #ruApp > * {
        margin-left: auto;
        margin-right: auto;
      }
      #ruApp .container,
      #ruApp .container-fluid,
      #ruApp .content,
      #ruApp .page-content,
      #ruApp .main-content {
        margin-left: auto !important;
        margin-right: auto !important;
        max-width: 1280px;
        float: none !important;
      }
      /* Channel / sales-channel card grids: centre the wrapped rows. */
      #ruApp .row,
      #ruApp [class*="channels-list"],
      #ruApp [class*="channel-list"],
      #ruApp [class*="card-list"],
      #ruApp [class*="tiles"] {
        justify-content: center;
      }

      /*
        Channel logo fallback: the upstream channel-logo CDN currently 404s for many
        channels, which left every card visually empty. When a logo fails we swap in a
        text label built from the image's alt text so the channel is still identifiable
        and connectable.
      */
      #ruApp .rolos-logo-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 10px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        color: #1a1a2e;
      }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!--
      Host document for the Rentals United White Label one-line script.

      It must be served from a real URL (not an `srcdoc` iframe): the embedded Angular
      client calls history.replaceState/pushState on boot, which throws a SecurityError
      in a srcdoc document and makes the client show its generic "OOOPS" dialog.
    -->
    <div id="ruApp"></div>
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search);
        var token = q.get("token") || "";
        var refreshToken = q.get("refreshToken") || "";
        var ownerId = q.get("ownerId") || "";

        // Follow the ROL'OS theme: the host page hands us its resolved background
        // colour and light/dark mode so the frame never looks pasted on.
        var bg = q.get("bg");
        if (bg) document.documentElement.style.setProperty("--rolos-bg", bg);
        document.documentElement.setAttribute(
          "data-rolos-theme",
          q.get("theme") === "dark" ? "dark" : "light"
        );
        // Later theme switches arrive from the parent without reloading the client.
        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== "rolos-theme") return;
          if (data.bg) document.documentElement.style.setProperty("--rolos-bg", data.bg);
          document.documentElement.setAttribute(
            "data-rolos-theme",
            data.theme === "dark" ? "dark" : "light"
          );
        });

        if (!token || !refreshToken) {
          parent.postMessage({ type: "ru-wl-error" }, "*");
          return;
        }
        var src =
          "https://new.rentalsunited.com/white-pms-client/script?" +
          new URLSearchParams({
            token: token,
            refreshToken: refreshToken,
            languageId: q.get("languageId") || "1",
            uiVersion: q.get("uiVersion") || "2",
            ownerId: ownerId,
          }).toString();

        function boot() {
          var s = document.createElement("script");
          s.src = src;
          s.onerror = function () {
            parent.postMessage({ type: "ru-wl-error" }, "*");
          };
          document.head.appendChild(s);
        }
        if (window.jQuery) boot();
        else window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
