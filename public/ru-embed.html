<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel Manager</title>

    <!--
      Official White Label Channel Manager install assets. The vendor's Connect
      surface is a Bootstrap 3.3.7 dropdown/modal, so these must be present on this
      document and no other Bootstrap version may be loaded here.
      `<base href="/">` belongs to this embed document only, never the parent SPA.
    -->
    <base href="/" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous"
    />
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
      integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }
      #ruApp {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Host document for the vendor White Label one-line script.

      It must be served from a real URL (not an `srcdoc` iframe): the embedded client
      calls history.replaceState/pushState on boot, which throws a SecurityError in a
      srcdoc document and makes the client show its generic "OOOPS" dialog.

      Nothing here may read, restyle or rewrite the client's DOM after boot.
    -->
    <div id="ruApp"></div>
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search);
        var token = q.get("token") || "";
        var refreshToken = q.get("refreshToken") || "";
        var ownerId = q.get("ownerId") || "";

        if (!token || !refreshToken) {
          parent.postMessage({ type: "ru-wl-error" }, "*");
          return;
        }

        var src =
          "https://new.rentalsunited.com/white-pms-client/script?" +
          new URLSearchParams({
            token: token,
            refreshToken: refreshToken,
            languageId: q.get("languageId") || "1",
            uiVersion: q.get("uiVersion") || "2",
            ownerId: ownerId,
          }).toString();

        var readySent = false;
        var readyObserver = null;
        function signalReady() {
          if (readySent) return;
          readySent = true;
          if (readyObserver) readyObserver.disconnect();
          parent.postMessage({ type: "ru-wl-ready" }, "*");
        }

        function watchForCards() {
          readyObserver = new MutationObserver(function () {
            if (document.querySelector("#ruApp .channel-card")) signalReady();
          });
          readyObserver.observe(document.getElementById("ruApp"), {
            childList: true,
            subtree: true,
          });
          // Fallback: hand the canvas over 8s after the client script loads even if
          // the card selector never matches, so the parent loader never sticks.
          setTimeout(signalReady, 8000);
        }

        function boot() {
          var s = document.createElement("script");
          s.src = src;
          s.onload = watchForCards;
          s.onerror = function () {
            parent.postMessage({ type: "ru-wl-error" }, "*");
          };
          document.head.appendChild(s);
        }

        if (window.jQuery) boot();
        else window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
