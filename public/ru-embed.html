<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel Manager</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Set from the ?bg= param so the frame matches the ROL'OS page background. */
        background: var(--rolos-bg, #fff);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #ruApp {
        min-height: 100%;
        background: transparent;
      }

      /*
        Night mode. The embedded channel manager ships a light-only stylesheet, so the
        rendered tree is tone-mapped to match the ROL'OS dark theme, and media
        (logos, channel artwork, photos) is mapped back so it stays true to colour.
      */
      html[data-rolos-theme="dark"] #ruApp {
        filter: invert(0.92) hue-rotate(180deg);
      }
      html[data-rolos-theme="dark"] #ruApp img,
      html[data-rolos-theme="dark"] #ruApp svg,
      html[data-rolos-theme="dark"] #ruApp video,
      html[data-rolos-theme="dark"] #ruApp canvas,
      html[data-rolos-theme="dark"] #ruApp [style*="background-image"] {
        filter: invert(1) hue-rotate(180deg);
      }


      /*
        Layout-only centering of the White Label client. RU ships a left-aligned
        fluid layout; inside our fixed-width embed frame that leaves a large gap on
        the right. We centre their page shell and the channel card grids without
        touching any of their colours, sizing or behaviour.
      */
      #ruApp > * {
        margin-left: auto;
        margin-right: auto;
      }
      #ruApp .container,
      #ruApp .container-fluid,
      #ruApp .content,
      #ruApp .page-content,
      #ruApp .main-content {
        margin-left: auto !important;
        margin-right: auto !important;
        max-width: 1280px;
        float: none !important;
      }
      /* Channel / sales-channel card grids: centre the wrapped rows. */
      #ruApp .row,
      #ruApp [class*="channels-list"],
      #ruApp [class*="channel-list"],
      #ruApp [class*="card-list"],
      #ruApp [class*="tiles"] {
        justify-content: center;
      }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!--
      Host document for the Rentals United White Label one-line script.

      It must be served from a real URL (not an `srcdoc` iframe): the embedded Angular
      client calls history.replaceState/pushState on boot, which throws a SecurityError
      in a srcdoc document and makes the client show its generic "OOOPS" dialog.
    -->
    <div id="ruApp"></div>
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search);
        var token = q.get("token") || "";
        var refreshToken = q.get("refreshToken") || "";
        var ownerId = q.get("ownerId") || "";
        if (!token || !refreshToken) {
          parent.postMessage({ type: "ru-wl-error" }, "*");
          return;
        }
        var src =
          "https://new.rentalsunited.com/white-pms-client/script?" +
          new URLSearchParams({
            token: token,
            refreshToken: refreshToken,
            languageId: q.get("languageId") || "1",
            uiVersion: q.get("uiVersion") || "2",
            ownerId: ownerId,
          }).toString();

        function boot() {
          var s = document.createElement("script");
          s.src = src;
          s.onerror = function () {
            parent.postMessage({ type: "ru-wl-error" }, "*");
          };
          document.head.appendChild(s);
        }
        if (window.jQuery) boot();
        else window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
